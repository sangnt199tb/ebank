server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Bật tính năng tự động tìm route qua Eureka
          lower-case-service-id: true # Tự động viết thường tên service (vd: FILE-SERVICE -> file-service)
          # 1. Tự động gắn tiền tố /api-gateway/ cho MỌI service
          predicates:
            - name: Path
              args:
                pattern: "'/api-gateway/' + serviceId + '/**'"
          # 2. Tự động cắt tiền tố /api-gateway/ đi trước khi gọi xuống service con
          filters:
            - name: StripPrefix
              args:
                parts: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: K7vN3pL9xM2qR5wT8jY4bC6zF1gH0dJ9sK5mN2bP

api:
  gateway:
    open-endpoints: /api-gateway/auth-service/auth/login, /api-gateway/onboard-service/, /api-gateway/eureka, /api-gateway/file-service/v1/file/upload