server:
  port: 8083
  servlet:
    context-path: /onboard-service

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/onboard_ebank
    username: root
    password: Putin@140223
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: onboard-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://ebank-discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true